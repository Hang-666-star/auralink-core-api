name: Core API CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build core API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and build production artifact
        run: mvn -B -ntp clean package

      - name: Verify PostgreSQL runtime driver
        run: jar tf target/auralink-backend-0.0.1-SNAPSHOT.jar | grep -E 'BOOT-INF/lib/postgresql-[^/]+\.jar$'

      - name: Verify accepted R25 packaged contracts
        run: python3 scripts/verify-r25-artifact.py target/auralink-backend-0.0.1-SNAPSHOT.jar --output target/r25-artifact-verification.json

      - name: Preserve verified build for R25 staging
        uses: actions/upload-artifact@v4
        with:
          name: core-api-r25-${{ github.sha }}
          path: |
            target/auralink-backend-0.0.1-SNAPSHOT.jar
            target/r25-artifact-verification.json
            target/surefire-reports/
          if-no-files-found: error

  release-source:
    name: Verify main-to-release promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch as the release source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "Only pull requests from main may target release." >&2
            exit 1
          fi
          echo "Verified promotion path: main -> release"
