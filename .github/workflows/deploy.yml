name: Stage Verified Core API for R25

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: core-api-r25-artifact-staging
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and build the exact release source
        run: mvn -B -ntp clean package
      - name: Verify the packaged R25 contracts
        run: python3 scripts/verify-r25-artifact.py target/auralink-backend-0.0.1-SNAPSHOT.jar --output target/r25-artifact-verification.json
      - name: Retain this verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-api-r25-staging-${{ github.sha }}
          path: |
            target/auralink-backend-0.0.1-SNAPSHOT.jar
            target/r25-artifact-verification.json
            target/surefire-reports/
          if-no-files-found: error
      - name: Copy build bytes only into isolated incoming
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: target/auralink-backend-0.0.1-SNAPSHOT.jar
          target: /root/autodl-tmp/auralink-core-deploy/incoming
          strip_components: 1
      - name: Register verified staging only; never activate production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            JAR=/root/autodl-tmp/auralink-core-deploy/incoming/auralink-backend-0.0.1-SNAPSHOT.jar
            test -f "$JAR" && test ! -L "$JAR"
            chmod 600 "$JAR"
            SHA=$(sha256sum "$JAR" | cut -d ' ' -f 1)
            /root/autodl-tmp/auralink-core-deploy/bin/deploy-core.sh stage "${{ github.sha }}" "$JAR" "$SHA"
            /root/autodl-tmp/auralink-core-deploy/bin/deploy-core.sh status
