name: Stage Verified Core API for R25

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    concurrency:
      group: core-api-r25-artifact-staging
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and build the exact release source
        run: mvn -B -ntp clean package
      - name: Verify the packaged R25 contracts
        run: python3 scripts/verify-r25-artifact.py target/auralink-backend-0.0.1-SNAPSHOT.jar --output target/r25-artifact-verification.json
      - name: Retain this verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-api-r25-staging-${{ github.sha }}
          path: |
            target/auralink-backend-0.0.1-SNAPSHOT.jar
            target/r25-artifact-verification.json
            target/surefire-reports/
          if-no-files-found: error
      - name: Publication is owned by R25, not this workflow
        run: |
          echo "Verified artifacts are available for isolated R25 staging."
          echo "This workflow does not connect to production or control Java."
          echo "Production activation requires the approved R25 coordinator."
