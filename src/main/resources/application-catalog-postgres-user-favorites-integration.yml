# Local-only R24 integration profile.  SQLite remains a disposable bootstrap
# store for unported modules only; users, JWT lookup, catalog and painting
# favourites use the explicit PostgreSQL pools below.
server:
  address: 127.0.0.1
  port: ${CATALOG_USER_FAVORITES_TEST_PORT:18096}

spring:
  config:
    import: "optional:file:./runtime/integration-only.env[.properties]"
  datasource:
    url: "jdbc:sqlite:./runtime/catalog-user-favorites-integration.sqlite"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-init-sql: "PRAGMA foreign_keys=ON"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    init-sqls:
      - "PRAGMA foreign_keys=ON"
  task:
    scheduling:
      enabled: false

auralink:
  cors:
    allowed-origins: "http://127.0.0.1:13093"
  jwt:
    # Synthetic local HMAC key, not a production signing key.
    secret: "Y2F0YWxvZy11c2VyLWZhdm91cml0ZXMtaW50ZWdyYXRpb24tc3ludGhldGljLTIwMjYtMDk="
    expiration: 3600000
  storage:
    upload-dir: "./runtime/uploads"
    audio-dir: "./runtime/audios"
    legacy-frontend-audio-dir: "./runtime/legacy-audios"
  media-assets:
    managed-dir: "./runtime/media-assets"
    max-upload-bytes: 10485760
    max-generated-bytes: 10485760
    max-image-pixels: 40000000
  paintings:
    import-enabled: false
    import-fail-on-error: true
    metadata-csv-path: "./runtime/catalog-import-disabled.csv"
    picture-dir: "./runtime/catalog-import-disabled-images"
  catalog-read:
    enabled: true
    datasource:
      jdbc-url: "jdbc:postgresql://127.0.0.1:55437/artlive_catalog_prototype"
      username: artlive_proto
      password: "${CATALOG_READ_PG_PASSWORD}"
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout-ms: 2000
    batch-media-roots:
      - batch-id: "7f2f9d0a-5db0-4a61-bc67-e995bd0fd701"
        revision: 1
        root: "../postgres-prototype/examples/legacy-27"
      - batch-id: "d43becc4-c424-4b63-99d8-af5f072bbd8d"
        revision: 1
        root: "../postgres-prototype/examples/contemporary-study"
      - batch-id: "d43becc4-c424-4b63-99d8-af5f072bbd8d"
        revision: 2
        root: "../postgres-prototype/examples/contemporary-study-r2"
      - batch-id: "e1f125f2-ef65-4d3e-a05c-5a7edbfc3b31"
        revision: 1
        root: "../postgres-prototype/examples/concurrent-study"
  catalog-auth:
    enabled: true
    datasource:
      jdbc-url: "jdbc:postgresql://127.0.0.1:55437/artlive_catalog_prototype"
      username: artlive_proto
      password: "${CATALOG_AUTH_PG_PASSWORD}"
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout-ms: 2000
  guide:
    enabled: false
  critic:
    enabled: false
  workflows:
    enabled: false
  creations:
    enabled: false
  creation-providers:
    enabled: false
